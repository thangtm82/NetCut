name: Windows MAUI Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install Windows-only MAUI workload
        run: dotnet workload install maui-windows
      - name: Restore and compile
        run: dotnet build NetCut/NetCut.csproj -f net9.0-windows10.0.19041.0 -c Release -p:WindowsPackageType=None
